name: CI Baseline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-checks:
    name: Fast Baseline Checks (Contracts, Lints, Tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install native Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify contracts and drift
        run: |
          pnpm contract:test
          pnpm contract:drift

      - name: Verify security baseline
        run: pnpm verify:security

      - name: Frontend quality gates
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build

      - name: Python unit tests
        run: python3 -m unittest discover -s services/python-backend/tests -v

      - name: Rust formatting, clippy, and unit tests
        run: |
          cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  windows-x64:
    name: Windows 11 / 2022 x64 Packaging & E2E
    runs-on: windows-2022
    needs: fast-checks
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python build tools
        run: python -m pip install pyinstaller==6.21.0

      - name: Build packaged sidecar
        run: python scripts/build-sidecar/build_sidecar.py

      - name: Test packaged sidecar in Rust
        env:
          PRIME_SHELL_PACKAGED_SIDECAR: D:\a\prime-shell\prime-shell\services\python-backend\dist\sidecar\windows-x86_64\prime-shell-python-backend\prime-shell-python-backend.exe
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --test packaged_sidecar -- --ignored

      - name: Build Tauri app with WebDriver feature
        run: pnpm --filter @prime-shell/desktop tauri build --no-bundle --features webdriver

      - name: Run WebdriverIO native journey
        run: pnpm test:e2e

      - name: Build production NSIS installer (excludes WebDriver)
        run: pnpm --filter @prime-shell/desktop tauri build --bundles nsis

      - name: Verify production binary excludes WebDriver capabilities
        run: |
          python -c "
          with open('apps/desktop/src-tauri/target/release/prime-shell-desktop.exe', 'rb') as f:
              data = f.read()
          patterns = [b'tauri_plugin_wdio_webdriver', b'tauri-plugin-wdio-webdriver']
          found = [p.decode() for p in patterns if p in data]
          assert len(found) == 0, f'WebDriver capability leaked: {found}'
          print('Production binary verified clean.')
          "

  ubuntu-2404:
    name: Ubuntu 24.04 x64 Packaging & Native Probe
    runs-on: ubuntu-24.04
    needs: fast-checks
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            xvfb

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packaged Python sidecar
        run: |
          python3 -m venv .venv-build
          .venv-build/bin/python -m pip install --no-input -r services/python-backend/requirements-build.lock
          pnpm sidecar:build
          pnpm sidecar:verify

      - name: Test Rust integration
        env:
          PRIME_SHELL_PACKAGED_SIDECAR: ../../../services/python-backend/dist/sidecar/linux-x86_64/prime-shell-python-backend/prime-shell-python-backend
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked -- --include-ignored

      - name: Build Tauri release deb package
        run: xvfb-run -a pnpm --filter @prime-shell/desktop tauri build --bundles deb -- --locked

      - name: Verify native Tauri runtime
        run: pnpm native:verify

      - name: Verify deb binary excludes WebDriver capabilities
        run: |
          DEB_FILE=$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          dpkg-deb -x "$DEB_FILE" /tmp/deb_check
          strings /tmp/deb_check/usr/bin/prime-shell-desktop | grep -E 'tauri_plugin_wdio_webdriver|wdio-webdriver' && exit 1 || echo "Linux production package verified clean."

  macos-arm64:
    name: macOS arm64 Build Evaluation
    runs-on: macos-14
    needs: fast-checks
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri macOS app bundle
        run: pnpm --filter @prime-shell/desktop tauri build --bundles app -- --locked || echo "macOS build evaluated"
