[package]
name = "prime-text-studio-desktop"
version = "0.1.0"
description = "Prime Text Studio Desktop Application"
authors = ["Prime Builds"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "prime_text_studio_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "prime-text-studio"
path = "src/main.rs"

[build-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rfd = "=0.15.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.2.0"
thiserror = "=2.0.17"

[features]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
