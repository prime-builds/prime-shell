[[permission]]
identifier = "allow-backend-status"
description = "Allows the main window to read the bounded backend readiness status."
commands.allow = ["backend_status"]

[[permission]]
identifier = "allow-echo-text"
description = "Allows the main window to invoke only the typed WP01 Unicode echo command."
commands.allow = ["echo_text"]

[[permission]]
identifier = "allow-task-lifecycle"
description = "Allows production task lifecycle commands."
commands.allow = [
  "start_count_task",
  "cancel_task",
  "get_task_snapshot",
  "reset_backend"
]

[[permission]]
identifier = "allow-test-faults"
description = "Allows test-only fault injection commands (excluded from production capabilities)."
commands.allow = [
  "trigger_crash",
  "trigger_hang",
  "trigger_large_rejected"
]

[[permission]]
identifier = "allow-runtime-probe"
description = "Allows reading the native runtime verifier configuration."
commands.allow = ["runtime_probe_config"]

[[permission]]
identifier = "allow-test-evidence-writer"
description = "Allows test-only runtime evidence writer command (excluded from production capabilities)."
commands.allow = ["write_runtime_evidence"]

[[permission]]
identifier = "allow-theme-state"
description = "Allows the main window to query theme state and synchronize native window theme."
commands.allow = ["get_theme_state", "sync_native_window_theme"]

[[permission]]
identifier = "allow-layout-preferences"
description = "Allows the main window to query, persist, and reset bounded shell layout preferences."
commands.allow = [
  "get_shell_layout_preferences",
  "save_shell_layout_preferences",
  "reset_shell_layout_preferences"
]

[[permission]]
identifier = "allow-native-intent"
description = "Allows the main window to invoke named native document intent commands."
commands.allow = [
  "open_document_intent",
  "save_document_intent",
  "read_document_content",
  "write_document_content",
  "revoke_document_ref"
]

[[permission]]
identifier = "allow-document-analysis"
description = "Allows the main window to invoke document analysis tasks."
commands.allow = ["start_document_analysis_task"]

[[permission]]
identifier = "allow-settings"
description = "Allows the main window to query, persist, and reset canonical application settings."
commands.allow = [
  "get_settings",
  "save_settings",
  "reset_setting",
  "reset_settings_section",
  "reset_all_settings"
]

[[permission]]
identifier = "allow-diagnostics"
description = "Allows the main window to query diagnostics summary, safe errors, preview/export diagnostics, recover backend, and repair settings sections."
commands.allow = [
  "get_diagnostics_summary",
  "get_recent_safe_errors",
  "get_export_preview",
  "export_diagnostics",
  "recover_backend",
  "repair_settings_section"
]

[[permission]]
identifier = "allow-update"
description = "Allows the main window to query update status, change release channels, and check for updates."
commands.allow = [
  "get_update_status",
  "set_update_channel",
  "check_for_updates"
]

