[package]
name = "prime-shell-desktop"
version = "0.1.0"
description = "Prime Shell Phase 0B WP01 echo spike"
authors = ["Prime Shell"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "prime_shell_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "prime-shell-desktop"
path = "src/main.rs"

[build-dependencies]
sha2 = "=0.10.9"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }
thiserror = "=2.0.17"

[features]
default = []
webdriver = ["dep:tauri-plugin-wdio-webdriver"]

